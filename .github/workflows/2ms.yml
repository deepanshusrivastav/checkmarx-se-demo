name: Too Many Secrets Scan

on:
  push:
    branches:
      - demo-setup
  pull_request:
    branches:
      - demo-setup

permissions:
  contents: read
  security-events: write

jobs:
  secrets-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Too Many Secrets
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            checkmarx/2ms:latest \
            filesystem /repo \
            --report-path /repo/2ms.sarif \
            --ignore-on-exit results

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 2ms.sarif
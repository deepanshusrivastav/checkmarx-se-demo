name: Too Many Secrets Scan

on:
  push:
    branches:
      - demo-setup

  pull_request:
    branches:
      - demo-setup

jobs:
  secrets-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show 2MS Help
        run: |
          docker run --rm checkmarx/2ms:latest --help
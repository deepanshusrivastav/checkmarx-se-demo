apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: vulnerable

  template:
    metadata:
      labels:
        app: vulnerable

    spec:
      containers:
      - name: nginx
        image: nginx:latest

        securityContext:
          privileged: true

        ports:
        - containerPort: 80